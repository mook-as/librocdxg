name: Build

# librocdxg is built inside WSL2 on Windows, against the Windows SDK headers
# (see README.md "Option A — Build from source"). This workflow installs a
# WSL2 distro manually (no third-party actions), then runs the same
# cmake/make steps documented in the README inside it.

on:
  push:

jobs:
  build-wsl:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: "Windows: install WSL2 and an openSUSE distro"
        shell: pwsh
        run: |
          # Sometimes this fails; retry in a loop.
          do { wsl --update } while ( -not $? )
          wsl --set-default-version 2

          # --no-launch registers and extracts the distro without running its
          # interactive first-boot OOBE (user creation etc.). Remove the OOBE
          # config so the distro just defaults to root, rather than relying on
          # `--user root` (which the OOBE trigger does not reliably respect)
          # on every subsequent invocation.
          wsl --install --no-launch --version 2 --name openSUSE openSUSE-Leap-16.0
          wsl --user root --distribution openSUSE -- rm --force /etc/wsl-distribution.conf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Windows: locate Windows SDK"
        shell: pwsh
        run: |
          $root = Get-ItemPropertyValue 'HKLM:\Software\Microsoft\Windows Kits\Installed Roots' KitsRoot10
          $version = Get-ChildItem 'HKLM:\Software\Microsoft\Windows Kits\Installed Roots' |
            Select-Object -ExpandProperty PSChildName |
            Select-String -Raw -Pattern '^\d+(\.\d+){2,3}$' |
            Sort-Object { [version]$_ } |
            Select-Object -Last 1

          if (-not $version) {
            throw 'No installed Windows SDK version found under HKLM:\Software\Microsoft\Windows Kits\Installed Roots'
          }

          $winSdkInclude = Join-Path $root Include $version
          Write-Host "Using Windows SDK: $winSdkInclude"
          "WIN_SDK_INCLUDE=$winSdkInclude" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: "WSL: install build toolchain"
        shell: pwsh
        run: >-
          wsl --distribution openSUSE --exec
          zypper --non-interactive install --no-recommends
          pattern:devel_C_C++ cmake ninja

      - name: "WSL: Prepare for build"
        shell: bash -euxo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          mkdir --parents build amdsmi/build
          cd "$(mktemp --directory --tmpdir='${{ runner.temp }}')"
          cat > run-in-wsl.cmd <<'EOF'
          @echo off
          dos2unix %1
          for /f "tokens=* usebackq" %%F in (`wsl --distribution openSUSE --exec wslpath -a %1`) do (
            wsl --distribution openSUSE --exec /bin/bash -euxo pipefail %%F
          )
          EOF
          cygpath --windows --absolute $PWD >> "$GITHUB_PATH"

      - name: "WSL: build librocdxg"
        shell: run-in-wsl.cmd {0}
        env:
          CMAKE_GENERATOR: Ninja
          WSLENV: CMAKE_GENERATOR:WIN_SDK_INCLUDE/p
        working-directory: build
        run: |
          cmake .. -DWIN_SDK="$WIN_SDK_INCLUDE/shared"
          ninja
          cpack -G TGZ -D CPACK_INCLUDE_TOPLEVEL_DIRECTORY=0 -D CPACK_THREADS=0
          cp *.tar.gz ..

      - name: "WSL: build amdsmi"
        # amdsmi is a separate sub-project (its own top-level
        # CMakeLists.txt), not pulled in by the top-level build above; it
        # provides the amdsmi shared library referenced by the README.
        shell: run-in-wsl.cmd {0}
        env:
          CMAKE_GENERATOR: Ninja
          WSLENV: CMAKE_GENERATOR:WIN_SDK_INCLUDE/p
        working-directory: amdsmi/build
        run: |
          cmake .. -DWIN_SDK="$WIN_SDK_INCLUDE/shared"
          ninja
          cpack -G TGZ -D CPACK_INCLUDE_TOPLEVEL_DIRECTORY=0 -D CPACK_THREADS=0
          cp *.tar.gz ../..

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librocdxg
          path: "*.tar.gz"
          if-no-files-found: error
